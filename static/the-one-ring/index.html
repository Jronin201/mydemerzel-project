<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demerzel</title>
  <style>
    body {
      /* Remove: display: flex; align-items: ...; height: ...; */
      background: #181818;
      color: #f1f1f1;
      margin: 0;
      padding: 2rem 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #chat-container {
      margin: 0 auto;
      max-width: 800px;
      width: 90%;
      background: #232323;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5);
      padding: 2rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1em;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #333;
      margin-bottom: 1em;
    }

    .message {
      margin: 0.5em 0;
      line-height: 1.5;
    }

    .user {
      color: #81d4fa;
    }

    .assistant {
      color: #c5e1a5;
    }

    #userInput {
      padding: 1em;
      border: none;
      border-radius: 5px;
      background-color: #2a2a2a;
      color: white;
      font-size: 1em;
    }

    #userInput:focus {
      outline: none;
      border: 1px solid #555;
    }

    h1 {
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Right-side container for the chatbot -->
  <div id="chat-container">
    <h1>Demerzel</h1>
    <div id="messages"></div>
    <input id="userInput" type="text" placeholder="Type your message and press Enter..." autocomplete="off" />
  </div>

  <script>
    // JavaScript to interact with inputs
    const characterNameInput = document.getElementById("character-name");
    const statOneInput = document.getElementById("stat-value");

    // Function to get input values
    function logInputValues() {
      console.log("Character Name:", characterNameInput.value);
      console.log("Stat One:", statOneInput.value);
    }

    // For demonstration: log values on page load
    document.addEventListener("DOMContentLoaded", logInputValues);

    // Your existing JavaScript code remains unchanged
    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");

    // Existing event listeners and functions
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && input.value.trim()) {
        const userMessage = input.value.trim();
        appendMessage("You", userMessage, "user");
        input.value = "";

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userMessage })
          });

          const data = await response.json();
          appendMessage("Demerzel", data.response, "assistant");
        } catch (error) {
          appendMessage("Error", "There was a problem contacting the server.", "assistant");
        }

        messages.scrollTop = messages.scrollHeight;
      }
    });

    function appendMessage(sender, text, className) {
      const msg = document.createElement("p");
      msg.className = `message ${className}`;
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      messages.appendChild(msg);
    }
  </script>
</body>
</html>
