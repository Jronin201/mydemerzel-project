<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demerzel</title>
    <style>
      /* CSS Reset for better cross-browser compatibility */
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif, Arial,
          Helvetica;
        margin: 0;
        display: flex;
        height: 100vh; /* Total height of the screen */
        align-items: stretch;
        /* Fallbacks for older browsers */
        display: -webkit-box;
        display: -webkit-flex;
        -webkit-box-align: stretch;
        -webkit-align-items: stretch;
      }

      /* Styles for the left container and character sheet */
      #left-container {
        flex: 1; /* Take up one half of the screen */
        /* Fallback for older browsers */
        -webkit-box-flex: 1;
        -webkit-flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column; /* Align items vertically */
        /* Fallbacks for older browsers */
        display: -webkit-box;
        display: -webkit-flex;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        -webkit-box-align: center;
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        -webkit-align-items: center;
        padding: 1em;
        position: relative;
        background-color: #1e1e1e; /* Match character sheet */
      }

      #character-sheet, /* Combined styles for both elements */
    #Stat-One {
        position: absolute;
        width: 80%;
        max-width: 40vw;
        height: 30vh;
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        /* Webkit shadow fallback */
        -webkit-box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        color: #e0e0e0;
        border: 1px solid #333;
      }

      #character-sheet {
        left: 10%; /* Center the first box */
        top: 10%; /* Position this box near the top */
      }

      #Stat-One {
        left: 10%; /* Center the second box */
        top: 45%; /* Position this box below the first one */
      }

      #character-sheet label,
      #Stat-One label {
        display: block;
        margin-bottom: 0.5em;
        font-weight: bold;
      }

      .styled-input {
        width: 100%;
        padding: 0.5em;
        border: 1px solid #555;
        border-radius: 4px;
        background-color: #2a2a2a;
        color: #e0e0e0;
        font-size: 1em;
      }

      .styled-input:focus {
        outline: 2px solid #81d4fa;
        border-color: #81d4fa;
      }

      #chat-container {
        flex: 1;
        /* Fallback for older browsers */
        -webkit-box-flex: 1;
        -webkit-flex: 1;
        display: flex;
        flex-direction: column;
        /* Fallbacks for older browsers */
        display: -webkit-box;
        display: -webkit-flex;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        max-width: 800px;
        margin-left: auto;
        padding: 1em;
      }

      #chat-container h1 {
        margin-top: 0;
        margin-bottom: 1em;
        color: #f0f0f0;
      }

      #messages {
        flex: 1;
        /* Fallback for older browsers */
        -webkit-box-flex: 1;
        -webkit-flex: 1;
        overflow-y: auto;
        padding: 1em;
        border-radius: 8px;
        background: #1e1e1e;
        border: 1px solid #333;
        margin-bottom: 1em;
      }

      .message {
        margin: 0.5em 0;
        line-height: 1.5;
        word-wrap: break-word;
        word-break: break-word;
      }

      .user {
        color: #81d4fa;
      }

      .assistant {
        color: #c5e1a5;
      }

      #userInput {
        padding: 1em;
        border: none;
        border-radius: 5px;
        background-color: #2a2a2a;
        color: white;
        font-size: 1em;
        width: 100%;
      }

      #userInput:focus {
        outline: 2px solid #81d4fa;
        border: 1px solid #555;
      }

      /* Screen reader support */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          background-color: #000000;
          color: #ffffff;
        }

        #left-container,
        #character-sheet,
        #Stat-One,
        #chat-container,
        #messages {
          background-color: #000000;
          border-color: #ffffff;
        }

        .styled-input,
        #userInput {
          background-color: #000000;
          border-color: #ffffff;
          color: #ffffff;
        }
      }

      /* Mobile responsive */
      @media (max-width: 768px) {
        body {
          flex-direction: column;
          -webkit-box-orient: vertical;
          -webkit-flex-direction: column;
        }

        #left-container {
          height: 40vh;
          position: relative;
        }

        #character-sheet,
        #Stat-One {
          position: static;
          width: 100%;
          max-width: 100%;
          height: auto;
          margin-bottom: 1em;
        }

        #chat-container {
          max-width: 100%;
          height: 60vh;
        }
      }
    </style>
  </head>
  <body>
    <!-- Deprecated: This file is no longer in use. Auto-redirect to unified Witcher page -->
    <script>
      (function () {
        try {
          var target = "/static/ttrpg-chatbot/index.html?ttrpg=the-witcher";
          if (window.location.href.indexOf("ttrpg-chatbot") === -1) {
            window.location.replace(target);
          }
        } catch (e) {
          /* fail silently */
        }
      })();
    </script>

    <!-- Left-side container for the character sheet -->
    <div id="left-container">
      <!-- Character Name -->
      <div
        id="character-sheet"
        class="character-sheet"
        role="form"
        aria-label="Character information"
      >
        <label for="character-name">Character Name:</label>
        <input
          type="text"
          id="character-name"
          class="styled-input"
          aria-label="Enter character name"
          maxlength="50"
          placeholder="Enter character name"
        />
      </div>

      <!-- Stat One -->
      <div
        id="Stat-One"
        class="character-sheet"
        role="form"
        aria-label="Character statistics"
      >
        <label for="stat-value">Stat One:</label>
        <input
          type="text"
          id="stat-value"
          class="styled-input"
          aria-label="Enter stat value"
          maxlength="20"
          placeholder="Enter stat value"
        />
      </div>
    </div>

    <!-- Right-side container for the chatbot -->
    <div id="chat-container" role="main">
      <h1>Demerzel – The Witcher</h1>
      <div
        id="messages"
        role="log"
        aria-live="polite"
        aria-label="Chat messages"
      ></div>
      <label for="userInput" class="sr-only">Enter your message</label>
      <input
        id="userInput"
        type="text"
        placeholder="Type your message and press Enter..."
        autocomplete="off"
        role="textbox"
        aria-label="Chat input"
        maxlength="2000"
      />
    </div>

    <script>
      // Browser compatibility check and fallbacks
      (function () {
        "use strict";

        // Check for required features
        if (
          !document.getElementById ||
          !document.createElement ||
          !window.JSON
        ) {
          alert("This browser is not supported. Please use a modern browser.");
          return;
        }

        // JavaScript to interact with inputs
        var characterNameInput = document.getElementById("character-name");
        var statOneInput = document.getElementById("stat-value");

        // Function to get input values
        function logInputValues() {
          if (characterNameInput && statOneInput) {
            console.log("Character Name:", characterNameInput.value);
            console.log("Stat One:", statOneInput.value);
          }
        }

        // Fallback for browsers without addEventListener
        function addEvent(element, event, handler) {
          if (element.addEventListener) {
            element.addEventListener(event, handler, false);
          } else if (element.attachEvent) {
            element.attachEvent("on" + event, handler);
          } else {
            element["on" + event] = handler;
          }
        }

        // For demonstration: log values on page load
        addEvent(document, "DOMContentLoaded", logInputValues);

        // Your existing JavaScript code with compatibility improvements
        var messages = document.getElementById("messages");
        var input = document.getElementById("userInput");

        if (!messages || !input) {
          console.error("Required chat elements not found");
          return;
        }

        function appendMessage(sender, text, className) {
          var msg = document.createElement("p");
          msg.className = "message " + className;
          var senderNode = document.createElement("strong");
          senderNode.appendChild(document.createTextNode(sender + ": "));
          msg.appendChild(senderNode);
          msg.appendChild(document.createTextNode(text));
          messages.appendChild(msg);
        }

        // Polyfill for fetch if not available
        function makeFetchRequest(url, options, callback) {
          if (window.fetch) {
            fetch(url, options)
              .then(function (response) {
                if (!response.ok) {
                  return response.text().then(function (text) {
                    callback(
                      new Error("Server error " + response.status + ": " + text)
                    );
                  });
                }
                return response.json();
              })
              .then(function (data) {
                callback(null, data);
              })
              .catch(function (error) {
                callback(error);
              });
          } else {
            // XMLHttpRequest fallback
            var xhr = new XMLHttpRequest();
            xhr.open(options.method || "GET", url, true);

            if (options.headers) {
              for (var key in options.headers) {
                xhr.setRequestHeader(key, options.headers[key]);
              }
            }

            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                  try {
                    var data = JSON.parse(xhr.responseText);
                    callback(null, data);
                  } catch (e) {
                    callback(new Error("Invalid JSON response"));
                  }
                } else {
                  callback(
                    new Error(
                      "Server error " + xhr.status + ": " + xhr.responseText
                    )
                  );
                }
              }
            };

            xhr.onerror = function () {
              callback(new Error("Network error"));
            };

            xhr.send(options.body || null);
          }
        }

        function handleKeyDown(e) {
          var keyCode = e.keyCode || e.which;
          if (keyCode === 13 && input.value.trim()) {
            // Enter key
            var userMessage = input.value.trim();

            // Basic input validation
            if (userMessage.length > 2000) {
              appendMessage(
                "Error",
                "Message too long. Please keep it under 2000 characters.",
                "assistant"
              );
              return;
            }

            appendMessage("You", userMessage, "user");
            input.value = "";
            input.disabled = true;

            makeFetchRequest(
              "/chat",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userMessage }),
              },
              function (error, data) {
                input.disabled = false;

                if (error) {
                  appendMessage(
                    "Error",
                    "There was a problem contacting the server: " +
                      error.message,
                    "assistant"
                  );
                } else if (data && data.response) {
                  appendMessage("Demerzel", data.response, "assistant");
                } else {
                  appendMessage(
                    "Error",
                    "Invalid response from server",
                    "assistant"
                  );
                }

                messages.scrollTop = messages.scrollHeight;
                input.focus();
              }
            );
          }
        }

        addEvent(input, "keydown", handleKeyDown);
        input.focus();
      })();
    </script>
  </body>
</html>
