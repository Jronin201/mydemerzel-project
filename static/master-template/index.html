<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Template</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e1e;
        color: #f0f0f0;
      }

      .container {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 50%;
        margin-left: 100px; /* 100px to the right of center */
        width: calc(50% - 100px);
        padding: 20px;
        box-sizing: border-box;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 24px;
        color: #f8f8f8;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 10px;
        border: 1px solid #444;
        border-radius: 5px;
        padding: 10px;
        background-color: #2c2c2c;
      }

      .message {
        margin-bottom: 12px;
      }

      .user {
        color: #00bcd4;
      }

      .assistant {
        color: #cddc39;
      }

      #userInput {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #555;
        border-radius: 5px;
        background-color: #333;
        color: #f0f0f0;
      }

      #userInput:focus {
        outline: none;
        border-color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Master Template</h1>
      <div id="messages"></div>
      <input id="userInput" type="text" placeholder="Say something..." />
    </div>

    <script>
      // Browser compatibility check and fallbacks
      (function () {
        "use strict";

        // Check for required features
        if (
          !document.getElementById ||
          !document.createElement ||
          !window.JSON
        ) {
          alert("This browser is not supported. Please use a modern browser.");
          return;
        }

        var messages = document.getElementById("messages");
        var input = document.getElementById("userInput");

        if (!messages || !input) {
          console.error("Required elements not found");
          return;
        }

        // Fallback for browsers without addEventListener
        function addEvent(element, event, handler) {
          if (element.addEventListener) {
            element.addEventListener(event, handler, false);
          } else if (element.attachEvent) {
            element.attachEvent("on" + event, handler);
          } else {
            element["on" + event] = handler;
          }
        }

        function appendMessage(sender, text, className) {
          var msg = document.createElement("div");
          msg.className = "message " + className;
          msg.appendChild(document.createTextNode(sender + ": " + text));
          messages.appendChild(msg);
        }

        // Polyfill for fetch if not available
        function makeFetchRequest(url, options, callback) {
          if (window.fetch) {
            fetch(url, options)
              .then(function (response) {
                if (!response.ok) {
                  return response.text().then(function (text) {
                    callback(
                      new Error("Server error " + response.status + ": " + text)
                    );
                  });
                }
                return response.json();
              })
              .then(function (data) {
                callback(null, data);
              })
              .catch(function (error) {
                callback(error);
              });
          } else {
            // XMLHttpRequest fallback
            var xhr = new XMLHttpRequest();
            xhr.open(options.method || "GET", url, true);

            if (options.headers) {
              for (var key in options.headers) {
                xhr.setRequestHeader(key, options.headers[key]);
              }
            }

            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                  try {
                    var data = JSON.parse(xhr.responseText);
                    callback(null, data);
                  } catch (e) {
                    callback(new Error("Invalid JSON response"));
                  }
                } else {
                  callback(
                    new Error(
                      "Server error " + xhr.status + ": " + xhr.responseText
                    )
                  );
                }
              }
            };

            xhr.onerror = function () {
              callback(new Error("Network error"));
            };

            xhr.send(options.body || null);
          }
        }

        function handleKeyDown(e) {
          var keyCode = e.keyCode || e.which;
          if (keyCode === 13 && input.value.trim()) {
            // Enter key
            var userMessage = input.value.trim();
            appendMessage("You", userMessage, "user");
            input.value = "";
            input.disabled = true;

            makeFetchRequest(
              "/chat",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userMessage }),
              },
              function (error, data) {
                input.disabled = false;

                if (error) {
                  appendMessage("Error", error.message, "assistant");
                } else if (data && data.response) {
                  appendMessage("Demerzel", data.response, "assistant");
                } else {
                  appendMessage(
                    "Error",
                    "Invalid response from server",
                    "assistant"
                  );
                }

                messages.scrollTop = messages.scrollHeight;
                input.focus();
              }
            );
          }
        }

        addEvent(input, "keydown", handleKeyDown);
        input.focus();
      })();
    </script>
    <!-- Deprecated: This file is no longer in use. Functionality is centralized in /ttrpg-chatbot. -->
  </body>
</html>
