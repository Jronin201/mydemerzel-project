<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demerzel</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh; /* Total height of the screen */
      align-items: stretch;
    }

    /* Left container fills left half, position: relative for abs. children */
    #left-container {
      flex: 1;
      position: relative;
      background-color: #1e1e1e;
      overflow: visible;
    }

    /* Right container unchanged */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1em;
      background-color: #2a2a2a;
    }

    /* CHARACTER/STAT: Absolute with vw/vh positioning! */
    #character-sheet {
      position: absolute;
      top: 1vh;   /* 10% from top of viewport */
      left: 2vw;   /* 7% from left of viewport */
      width: 36vw; /* fits nicely within half screen */
      min-height: 6vh;
      background-color: #1e1e1e;
      padding: 1vh 1vw;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      color: #e0e0e0;
    }

    #Stat-One {
      position: absolute;
      top: 10vh;   /* adjust for vertical stacking */
      left: 4vw;
      width: 1vw;
      min-height: 6vh;
      background-color: #1e1e1e;
      padding: 0h 0vw;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      color: #e0e0e0;
    }

    /* Style inputs in left container, basic focus etc. */
    .styled-input {
      margin-top: 1px;
      width: 90%;
      padding: 0.6em;
      border-radius: 8px;
      border: none;
      background-color: #232323;
      color: #f0f0f0;
      font-size: 1em;
    }
    .styled-input:focus {
      outline: none;
      border: 1px solid #81d4fa;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1em;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #333;
      margin-bottom: 1em;
    }

    .message {
      margin: 0.5em 0;
      line-height: 1.5;
    }

    .user {
      color: #81d4fa;
    }

    .assistant {
      color: #c5e1a5;
    }

    #userInput {
      padding: 1em;
      border: none;
      border-radius: 5px;
      background-color: #2a2a2a;
      color: white;
      font-size: 1em;
    }
    #userInput:focus {
      outline: none;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <!-- Left-side container for the character sheet -->
  <div id="left-container">
    <!-- Character Name -->
    <div id="character-sheet" class="character-sheet">
      <label for="character-name">Character Name:</label>
      <input type="text" id="character-name" class="styled-input">
    </div>

    <!-- Stat One -->
    <div id="Stat-One" class="character-sheet">
      <label for="stat-value">Stat One:</label>
      <input type="text" id="stat-value" class="styled-input">
    </div>
  </div>

  <!-- Right-side container for the chatbot -->
  <div id="chat-container">
    <h1>Demerzel</h1>
    <div id="messages"></div>
    <input id="userInput" type="text" placeholder="Type your message and press Enter..." autocomplete="off" />
  </div>

  <script>
    // JavaScript to interact with inputs
    const characterNameInput = document.getElementById("character-name");
    const statOneInput = document.getElementById("stat-value");
    function logInputValues() {
      console.log("Character Name:", characterNameInput.value);
      console.log("Stat One:", statOneInput.value);
    }
    document.addEventListener("DOMContentLoaded", logInputValues);

    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && input.value.trim()) {
        const userMessage = input.value.trim();
        appendMessage("You", userMessage, "user");
        input.value = "";
        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userMessage })
          });
          const data = await response.json();
          appendMessage("Demerzel", data.response, "assistant");
        } catch (error) {
          appendMessage("Error", "There was a problem contacting the server.", "assistant");
        }
        messages.scrollTop = messages.scrollHeight;
      }
    });

    function appendMessage(sender, text, className) {
      const msg = document.createElement("p");
      msg.className = `message ${className}`;
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      messages.appendChild(msg);
    }
  </script>
</body>
</html>
